<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进阶数学手册 · 信号处理 / 控制 / 机器学习 / 泛化理论</title>
<link rel="stylesheet" href="assets/style.css">

<script>
/* ---------------- MathJax 配置（离线 SVG 输出，无字体依赖） ----------------
   这里用的是全量包 tex-svg-full.js：ams、boldsymbol 等扩展全都打在同一
   个文件里，排版期不会再向 input/tex/extensions/ 发子请求。原先的
   tex-svg.js 遇到 \boldsymbol 要单独去取 boldsymbol.js，那一次请求失败
   （资源缺失、被拦截、或缓存了旧的失败结果）就会让整个公式引擎起不来，
   页面上只剩一排 $…$。少一个请求，就少一个失败点。 */
window.MathJax = {
  tex: {
    inlineMath:  [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    tags: 'none',
    tagSide: 'right'
  },
  svg: { fontCache: 'global', scale: 1 },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
    ignoreHtmlClass: 'no-mathjax',
    enableMenu: true
  },
  startup: {
    typeset: true,
    /* 启动失败时给出可见提示，而不是静默留一页裸美元符号 */
    failed: function (err) { if (window.__mathFail) window.__mathFail(err); }
  }
};

/* 公式引擎没能启动时的提示条（外观样式在 assets/style.css 的 #mathFailBox） */
window.__mathFail = function (err) {
  if (document.getElementById('mathFailBox')) return;
  var msg = (err && err.message) ? err.message : String(err || '未知原因');
  var box = document.createElement('div');
  box.id = 'mathFailBox';
  var b = document.createElement('b');
  b.textContent = '公式引擎没能启动';
  var s = document.createElement('span');
  s.textContent = '正文里的公式会以 $…$ 的原样显示。多半是脚本没加载完，或者浏览器缓存了旧版本；' +
    '按住 Shift 刷新一次通常就好。技术信息：' + msg;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '重新加载';
  btn.addEventListener('click', function () { window.location.reload(); });
  box.appendChild(b);
  box.appendChild(s);
  box.appendChild(btn);
  document.body.appendChild(box);
};
</script>
</head>

<body>

<div class="progress" id="progress"></div>

<header class="topbar">
  <button class="btn-ico" id="btnNav" title="收起 / 展开整书目录" aria-label="整书目录" aria-pressed="false">☰</button>
  <div class="brand">
    <b>进阶数学手册</b>
    <span>信号处理 · 控制 · 机器学习 · 泛化理论</span>
  </div>
  <div class="spacer"></div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="搜索全书…（按 /）" autocomplete="off" spellcheck="false">
  </div>
  <button class="btn-ico" id="btnToc" title="收起 / 展开本节目录" aria-label="本节目录" aria-pressed="false">小节</button>
  <button class="btn-ico" onclick="window.print()" title="打印 / 导出 PDF">打印</button>
</header>

<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <article class="article" id="article"></article>
</main>

<aside class="toc-col" id="tocCol"></aside>

<section class="search-panel" id="searchPanel"></section>

<!-- 同步脚本（非 defer）：确保 MathJax 与数据在渲染前完全就绪 -->
<script src="vendor/mathjax/tex-svg-full.js"
        onerror="window.__mathFail && window.__mathFail('脚本未能加载：vendor/mathjax/tex-svg-full.js')"></script>
<script src="content/all.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
